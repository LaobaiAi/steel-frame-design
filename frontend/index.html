<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Frame 3D Viewer — CAIAO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; overflow: hidden; background: #1a1a2e; }
  #container { width: 100vw; height: 100vh; position: relative; }

  /* 控制面板 */
  #panel {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(26, 26, 46, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 16px;
    color: #e0e0e0;
    min-width: 220px;
    z-index: 100;
    font-size: 13px;
  }
  #panel h3 {
    margin-bottom: 12px; color: #64b5f6; font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
  }
  #panel .row { margin-bottom: 10px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; }
  #panel input[type=range] { width: 100%; margin-top: 4px; accent-color: #64b5f6; }
  #panel button {
    width: 100%; padding: 8px;
    border: 1px solid #64b5f6; border-radius: 6px;
    background: transparent; color: #64b5f6;
    cursor: pointer; font-size: 13px; margin-top: 8px;
    transition: all 0.2s;
  }
  #panel button:hover { background: rgba(100,181,246,0.15); }
  #panel button.active { background: #64b5f6; color: #1a1a2e; }

  /* 图例 */
  #legend {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(26, 26, 46, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 10px 14px;
    color: #e0e0e0;
    font-size: 12px; z-index: 100;
  }
  #legend .gradient {
    width: 120px; height: 10px;
    background: linear-gradient(to right, #00ff00, #ffff00, #ff0000);
    border-radius: 4px; margin: 4px 0;
  }
  #legend .labels {
    display: flex; justify-content: space-between;
  }

  /* 加载/拖放提示 */
  #drop-zone {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(26, 26, 46, 0.85);
    backdrop-filter: blur(10px);
    border: 1px dashed rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 12px 20px;
    color: #a0a0c0;
    font-size: 12px; z-index: 100;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #drop-zone:hover { border-color: #64b5f6; }
  #drop-zone input { display: none; }

  /* 信息提示 */
  #tooltip {
    position: absolute;
    background: rgba(0,0,0,0.85);
    color: #e0e0e0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 200;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="container">
  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    📂 加载 model_3d.json<br><small>或拖放文件到页面</small>
    <input type="file" id="file-input" accept=".json">
  </div>

  <div id="panel">
    <h3>🔧 控制面板</h3>
    <div class="row">
      <label>变形缩放: <span id="def-scale-val">1.0×</span></label>
      <input type="range" id="def-scale" min="0" max="200" value="100" step="1">
    </div>
    <div class="row">
      <label>显示线框</label>
      <input type="checkbox" id="show-wireframe" checked>
    </div>
    <div class="row">
      <label>显示截面</label>
      <input type="checkbox" id="show-solid" checked>
    </div>
    <div class="row">
      <label>显示变形</label>
      <input type="checkbox" id="show-deformed">
    </div>
    <div class="row">
      <label>颜色映射</label>
      <input type="checkbox" id="show-color" checked>
    </div>
    <button id="btn-reset" onclick="resetCamera()">🔄 重置视角</button>
    <button id="btn-top" onclick="viewTop()">🔝 俯视</button>
    <button id="btn-front" onclick="viewFront()">📐 正视</button>
  </div>

  <div id="legend">
    <div>应力比图例:</div>
    <div class="gradient"></div>
    <div class="labels"><span>0.0</span><span>0.5</span><span>≥1.0</span></div>
  </div>

  <div id="tooltip"></div>
</div>

<!-- Three.js CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="viewer.js"></script>
</body>
</html>
