name: Recreate Hugging Face Space

on:
  workflow_dispatch:

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Delete and recreate Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q
          python -c "import os; os.environ['HF_HUB_DISABLE_SYMLINKS_WARNING']='1'; from huggingface_hub import HfApi; api=HfApi(token=os.environ['HF_TOKEN']); api.delete_repo('LaobaiAi/steel-frame-design', repo_type='space'); print('Deleted')"
          sleep 10
          python -c "import os; os.environ['HF_HUB_DISABLE_SYMLINKS_WARNING']='1'; from huggingface_hub import HfApi; api=HfApi(token=os.environ['HF_TOKEN']); api.create_repo('LaobaiAi/steel-frame-design', repo_type='space', space_sdk='docker'); print('Created')"

      - name: Upload and wait for build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q
          python scripts/upload_to_hf.py
