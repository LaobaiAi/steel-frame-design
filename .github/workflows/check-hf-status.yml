name: Check HF Space Status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF Space Status
        run: |
          curl -s https://huggingface.co/api/spaces/LaobaiAi/steel-frame-design | python3 -c "
import sys, json
d = json.load(sys.stdin)
r = d.get('runtime', {})
print('Stage:', r.get('stage'))
print('SDK:', d.get('sdk'))
print('Error:', r.get('errorMessage', 'None'))
"
