name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install huggingface-hub
        run: pip install huggingface-hub -q

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/upload_to_hf.py

      - name: Wait for build
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s https://huggingface.co/api/spaces/LaobaiAi/steel-frame-design \
              | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('runtime',{}); print(r.get('stage','?'))" 2>/dev/null)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "RUNNING_BUILDING" ]; then
              echo "Space is running!"
              echo "URL: https://LaobaiAi-steel-frame-design.hf.space"
              break
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "STOPPED" ]; then
              echo "Build failed!"
              curl -s https://huggingface.co/api/spaces/LaobaiAi/steel-frame-design \
                | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('runtime',{}); print('Error:', r.get('errorMessage','Unknown'))"
              break
            fi
            sleep 30
          done
