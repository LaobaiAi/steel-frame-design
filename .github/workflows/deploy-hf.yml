name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q
          python scripts/upload_to_hf.py

      - name: Check Space Build Status
        run: |
          echo "Waiting for Space to build..."
          for i in $(seq 1 60); do
            STAGE=$(curl -s https://huggingface.co/api/spaces/LaobaiAi/steel-frame-design \
              | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    r=d.get('runtime',{})
    print(r.get('stage','?'), r.get('errorMessage',''), sep='|')
except: print('parse_error|')
" 2>&1)
            STG=$(echo "$STAGE" | cut -d'|' -f1)
            ERR=$(echo "$STAGE" | cut -d'|' -f2-)
            echo "[$i] stage=$STG error=$ERR"

            if [ "$STG" = "RUNNING" ]; then
              echo "Space is running!"
              echo "URL: https://LaobaiAi-steel-frame-design.hf.space"
              exit 0
            fi
            if [ "$STG" = "ERROR" ] || [ "$STG" = "STOPPED" ]; then
              echo "Space build failed: $ERR"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for build"
          exit 1
