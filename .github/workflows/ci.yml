name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Python: lint + tests
  # ============================================================
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check servers/ tests/ caiao_hub.py cli/ --output-format=github
        continue-on-error: true

      - name: Run tests
        run: python tests/test_servers.py
        timeout-minutes: 10

  # ============================================================
  # Frontend: lint + type-check + build
  # ============================================================
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

  # ============================================================
  # 汇总状态 (合并检查)
  # ============================================================
  all-checks:
    name: All Checks Passed
    needs: [python, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require success
        run: |
          if [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "Python checks failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend checks failed"
            exit 1
          fi
          echo "All checks passed"

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: [all-checks]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q
          python scripts/upload_to_hf.py

      - name: Wait for Build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Waiting for HF Space build..."
          pip install huggingface-hub -q 2>/dev/null
          for i in $(seq 1 180); do
            STATUS=$(python3 -c "
import os, json, urllib.request
from huggingface_hub import HfApi
api = HfApi(token=os.environ.get('HF_TOKEN',''))
try:
    info = api.space_info('LaobaiAi/steel-frame-design')
    stage = info.runtime.stage if info.runtime else '?'
    err = info.runtime.errorMessage if info.runtime and info.runtime.errorMessage else ''
    print(f'{stage}|{err}')
except Exception as e:
    print(f'API_ERROR|{e}')
" 2>&1)
            STG=$(echo "$STATUS" | cut -d'|' -f1)
            ERR=$(echo "$STATUS" | cut -d'|' -f2-)
            echo "[$i] stage=$STG error=$ERR"
            case "$STG" in
              RUNNING) echo "Ready!"; exit 0 ;;
              ERROR)   echo "Build failed: $ERR"; exit 1 ;;
              *)       sleep 20 ;;
            esac
          done
          echo "Timeout" && exit 1
