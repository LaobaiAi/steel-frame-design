name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Python: lint + tests
  # ============================================================
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check servers/ tests/ caiao_hub.py cli/ --output-format=github
        continue-on-error: true

      - name: Run tests
        run: python tests/test_servers.py
        timeout-minutes: 10

  # ============================================================
  # Frontend: lint + type-check + build
  # ============================================================
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

  # ============================================================
  # 汇总状态 (合并检查)
  # ============================================================
  all-checks:
    name: All Checks Passed
    needs: [python, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require success
        run: |
          if [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "Python checks failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend checks failed"
            exit 1
          fi
          echo "All checks passed"

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: [all-checks]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build and push Docker image
        env:
          IMG: ${{ env.REGISTRY }}/${{ github.repository_owner }}/steel-frame-design
        run: |
          IMG_LOWER=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          docker build -f Dockerfile.build -t $IMG_LOWER:${{ github.sha }} -t $IMG_LOWER:latest .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker push $IMG_LOWER:${{ github.sha }}
          docker push $IMG_LOWER:latest

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Set package visibility via GitHub API
          PACKAGE="steel-frame-design"
          echo "Making package $PACKAGE public..."
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/packages/container/$PACKAGE/visibility" \
            -d '{"visibility":"public"}')
          echo "Response: $RESP"
          # Alternative: use gh CLI
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null || true
          gh api --method PATCH "/repos/${{ github.repository }}/packages/container/$PACKAGE/visibility" \
            -f visibility=public 2>&1 || echo "gh failed, curl result=$RESP"

      - name: Deploy to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q
          python scripts/upload_to_hf.py
