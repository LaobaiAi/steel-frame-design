# Pre-commit hooks — 提交前自动检查
# 安装: pip install pre-commit && pre-commit install
# 手动运行所有文件: pre-commit run --all-files

repos:
  # ── 通用检查 ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: 去除行尾空白
      - id: end-of-file-fixer
        name: 确保文件以换行符结尾
      - id: check-yaml
        name: 检查 YAML 语法
      - id: check-json
        name: 检查 JSON 语法
      - id: check-added-large-files
        name: 禁止提交大文件 (>500KB)
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: 检查合并冲突残留
      - id: check-case-conflict
        name: 检查文件名大小写冲突
      - id: mixed-line-ending
        name: 统一换行符 (LF)
        args: ['--fix=lf']
      - id: detect-private-key
        name: 检查是否误提交私钥
      - id: debug-statements
        name: 检查调试语句 (breakpoint/ipdb)
        files: \.py$

  # ── Python 代码质量 ───────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: Ruff 代码检查
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$
      - id: ruff-format
        name: Ruff 代码格式化
        files: \.py$

  # ── Python 安全检查 ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit 安全扫描
        args: ['-c', 'pyproject.toml', '-q']
        files: \.py$

  # ── 前端检查 ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (前端)
        entry: bash -c 'cd frontend && npx eslint --fix --max-warnings 0'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        always_run: false
